name: Run Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CMDSTAN_VERSION: "2.36.0"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system libraries for Qt
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
          libfontconfig1 libdbus-1-3

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[test]"

    - name: Cache CmdStan
      uses: actions/cache@v6
      with:
        path: ~/.cmdstan
        key: cmdstan-${{ runner.os }}-${{ env.CMDSTAN_VERSION }}

    - name: Install CmdStan
      run: |
        python -c "import cmdstanpy; cmdstanpy.install_cmdstan(version='${{ env.CMDSTAN_VERSION }}', cores=4)"

    - name: Run tests with pytest
      run: |
        pytest --cov=pypillometry --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}