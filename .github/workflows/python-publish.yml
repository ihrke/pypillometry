# Build the package and upload it to PyPI when a GitHub release is published.
#
# Before creating the release, set VERSION to the tag name (e.g. v2.0.0) on
# master; the workflow fails if tag and VERSION differ. Releases marked as
# pre-release need a pre-release version (e.g. v2.1a1), otherwise pip
# installs them by default.
#
# Running the workflow manually (workflow_dispatch) builds and checks the
# package without uploading it.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Check that the release tag matches VERSION
      if: github.event_name == 'release'
      run: |
        version=$(tr -d '[:space:]' < VERSION)
        if [ "$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::VERSION ($version) does not match the release tag ($GITHUB_REF_NAME)"
          exit 1
        fi

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build
      run: python -m build

    - name: Check package metadata
      run: twine check --strict dist/*

    - name: Install and import the wheel
      run: |
        pip install dist/*.whl
        cd /tmp
        python -c "import pypillometry as pp; print(pp.__name__, 'imported')"
        pypilinfo --help > /dev/null

    - name: Upload to PyPI
      if: github.event_name == 'release'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: twine upload dist/*
