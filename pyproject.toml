[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pypillometry"
dynamic = ["version"]
description = "Pupillometry and Eye-tracking in Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthias Mittner", email = "matthias.mittner@uit.no" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "cmdstanpy",
    "matplotlib",
    "pandas",
    "jinja2",
    "requests",
    "loguru",
    "tqdm",
    "h5py",
    "eyelinkio",
    "PyQt5",
    "vispy>=0.14",
    "backports.zstd; python_version < '3.14'",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.scripts]
pypilview = "pypillometry.cli:pypilview_main"
edf2pypil = "pypillometry.cli:edf2pypil_main"
pypilinfo = "pypillometry.cli:pypilinfo_main"

[project.urls]
Homepage = "https://github.com/ihrke/pypillometry"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["pypillometry*"]

[tool.setuptools.package-data]
pypillometry = ["templates/*.html"]
"pypillometry.data" = ["*.asc"]
"pypillometry.stan" = ["*.stan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
